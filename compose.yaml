services:
  chat-robot:
    image: crpi-5zyp5pdzn7yrv5oo.cn-beijing.personal.cr.aliyuncs.com/zcc_0811/chat_robot:${IMAGE_TAG:-0.2.0}
    container_name: chat-robot
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - chat-robot-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  chat-robot-data:
    name: chat-robot-data
